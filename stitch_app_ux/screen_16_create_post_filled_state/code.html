</button>
</div>
<!-- Tag 2 -->
<div class="inline-flex items-center gap-1.5 h-8 pl-3 pr-1.5 rounded-full bg-tertiary-fixed text-on-tertiary-fixed font-label-md text-label-md">

<button aria-label="Remove waterfalls tag" class="w-5 h-5 rounded-full hover:bg-surface-variant flex items-center justify-center text-on-tertiary-fixed-variant transition-colors" type="button">
<span class="material-symbols-outlined text-[14px]">close</span>
</button>
</div>
</div>
</div>
</div>

</button>

<span class="material-symbols-outlined text-[24px]">local_offer</span>

</div>
</div>

<script>
  // Micro-interactions for tag and image removal
  document.getElementById('remove-img-btn')?.addEventListener('click', function() {
    const media = document.getElementById('attached-media');
    if (media) {
      media.style.transition = 'opacity 0.2s ease, transform 0.2s ease';
      media.style.opacity = '0';
      media.style.transform = 'scale(0.95)';
      setTimeout(() => media.remove(), 200);
    }
  });

  document.querySelectorAll('#tags-wrapper button').forEach(btn => {
    btn.addEventListener('click', function() {
      const tag = this.closest('div');
      if (tag) {
        tag.style.transition = 'opacity 0.15s ease, transform 0.15s ease';
        tag.style.opacity = '0';
        tag.style.transform = 'scale(0.8)';
        setTimeout(() => tag.remove(), 150);
      }
    });
  });
