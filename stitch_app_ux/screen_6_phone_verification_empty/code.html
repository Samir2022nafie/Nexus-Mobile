  </head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full px-margin bg-surface"><div class="flex flex-col w-full">
<!-- Top App Bar Navigation -->
<div class="flex items-center gap-space-sm h-14 w-full relative"><button aria-label="Go back" class="absolute left-0 flex items-center justify-center w-11 h-11 rounded-full text-on-surface active:bg-surface-container transition-colors" type="button">
  <span class="material-symbols-outlined text-[24px]">arrow_back</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight text-center w-full">
  Verify Phone
</h1></div>
<!-- Main Verification Card Content -->
<div class="flex flex-col items-center w-full pt-space-lg">
<!-- Warm Tactile Icon Badge -->
<div class="relative flex items-center justify-center w-24 h-24 rounded-full bg-tertiary-fixed/60 shadow-sm">
<div class="flex items-center justify-center w-16 h-16 rounded-full bg-primary-container/20 text-primary-container">
<span class="material-symbols-outlined text-[40px]" style="font-variation-settings: 'FILL' 1;">
          shield_person
        </span>
</div>
<!-- Subtle Decorative Floating Spark -->
<span class="absolute -top-1 -right-1 flex h-4 w-4">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary-container opacity-60"></span>
<span class="relative inline-flex rounded-full h-4 w-4 bg-primary-container"></span>
</span>
</div>
<!-- Editorial Typography Block -->
<div class="flex flex-col items-center text-center mt-space-lg max-w-[320px]">
<h2 class="font-headline-md text-headline-md text-on-surface">
        Verify your phone number
      </h2>
<p class="font-body-md text-body-md text-tertiary mt-space-xs">We sent a 6-digit code to<span class="block font-label-md text-on-surface mt-0.5">+251 9** *** **78</span></p>
</div>
<!-- 6-Digit OTP Empty Matrix -->
<div class="w-full mt-space-xl flex justify-center">
<div class="flex items-center justify-center gap-space-sm" id="otp-container">
<div class="w-12 h-12 rounded-xl bg-tertiary-fixed/70 shadow-sm flex items-center justify-center text-headline-sm font-headline-sm text-on-surface select-none" data-index="0"></div>
<div class="w-12 h-12 rounded-xl bg-tertiary-fixed/70 shadow-sm flex items-center justify-center text-headline-sm font-headline-sm text-on-surface select-none" data-index="1"></div>
<div class="w-12 h-12 rounded-xl bg-tertiary-fixed/70 shadow-sm flex items-center justify-center text-headline-sm font-headline-sm text-on-surface select-none" data-index="2"></div>
<div class="w-12 h-12 rounded-xl bg-tertiary-fixed/70 shadow-sm flex items-center justify-center text-headline-sm font-headline-sm text-on-surface select-none" data-index="3"></div>
<div class="w-12 h-12 rounded-xl bg-tertiary-fixed/70 shadow-sm flex items-center justify-center text-headline-sm font-headline-sm text-on-surface select-none" data-index="4"></div>
<div class="w-12 h-12 rounded-xl bg-tertiary-fixed/70 shadow-sm flex items-center justify-center text-headline-sm font-headline-sm text-on-surface select-none" data-index="5"></div>
</div>
</div>
<!-- Active Resend Timer Indicator -->
<div class="flex items-center justify-center gap-1.5 mt-space-md">
<span class="material-symbols-outlined text-[16px] text-tertiary">schedule</span>
<span class="font-caption-md text-caption-md text-tertiary"><button type="button" class="font-label-md text-label-md text-primary hover:underline cursor-pointer">Resend code via SMS</button></span>
</div>
<!-- Primary Action: Disabled Initial State -->
<div class="w-full mt-space-xl px-space-xs">
<button class="w-full h-12 rounded-full bg-primary-container text-on-primary-fixed font-label-lg text-label-lg flex items-center justify-center opacity-40 cursor-not-allowed shadow-none select-none transition-opacity" disabled="" id="verify-button" type="button">
        Verify
      </button>
</div>
<!-- Gentle Tactile Support Cue -->
<div class="mt-space-lg flex flex-col items-center">
<button class="font-caption-md text-caption-md text-secondary active:text-primary transition-colors flex items-center gap-1 py-2" type="button">
<span class="material-symbols-outlined text-[16px]">edit_note</span>
        Wrong number? Edit phone details
      </button>
</div>
<!-- Security Micro-Trust Footer Badge -->
<div class="mt-space-xl w-full max-w-xs bg-surface-container-low/70 rounded-xl p-space-sm flex items-center gap-space-sm shadow-sm">
<div class="flex items-center justify-center w-8 h-8 rounded-full bg-surface-container-highest text-tertiary shrink-0">
<span class="material-symbols-outlined text-[18px]">lock</span>
</div>
<p class="font-caption-sm text-caption-sm text-on-surface-variant leading-tight">
        End-to-end encrypted session for local community onboarding.
      </p>
</div>
</div>
</div>
<script>
  (function() {
    let timeLeft = 45;
    const countdownEl = document.getElementById('resend-countdown');
    
    if (countdownEl) {
      const timer = setInterval(() => {
        if (timeLeft <= 0) {
          clearInterval(timer);
          const parent = countdownEl.parentElement;
          if (parent) {
            parent.innerHTML = '<button type="button" class="font-label-md text-label-md text-primary hover:underline cursor-pointer">Resend code via SMS</button>';
          }
        } else {
          timeLeft--;
          const seconds = timeLeft < 10 ? '0' + timeLeft : timeLeft;
          countdownEl.textContent = '0:' + seconds;
        }
      }, 1000);
    }
  })();
</script></main>

</body></html>
