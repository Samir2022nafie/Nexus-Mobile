-headline-sm text-primary-container tracking-tight">Nexus</span><span class="font-label-md text-label-md text-tertiary ml-space-xs">/ Explore</span></div><div class="flex items-center gap-space-xs"><button aria-label="Notifications" class="relative w-11 h-11 flex items-center justify-center text-on-surface-variant hover:text-on-surface"><span class="material-symbols-outlined">notifications</span><span class="absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-error ring-2 ring-surface"></span></button><button aria-label="User Profile" class="w-11 h-11 flex items-center justify-center"><img alt="Profile" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAfXYBlaF64aPAgVfjTzie9QhgRNMIlG4C30ri18-CQE__XVUWXHvLZ2vzZnhrScAm--ZTlW_D7Rk3o74LY1A13XJQNuoJQ6qqW1PSZfoA9WRzoOOg_Vrh12b-kfsZkebhS-Aa2yRk5wt8vrFWOrRQC93BkwGoP6QrHE04e_uT_Od5kIB_HE4ZhKS_dSWNxbdg3o_Fn1s2YD9Z3yi4Ansvvsc_VN4lR1wcYJpV87RlE5jI4KozUGy_nyA"></button></div></div></header><main class="flex-1 flex flex-col relative w-full px-margin pt-16 pb-24 bg-surface"><div class="flex flex-col w-full">

<h1 class="font-headline-sm text-headline-sm text-on-surface text-center">
      Edit Profile
    </h1>
<button aria-label="Save profile changes" class="min-h-[44px] min-w-[44px] flex items-center justify-end text-primary-container font-label-lg text-label-lg transition-transform active:scale-95" id="save-btn" type="button">
      Save
    </button>
</div>
<!-- Profile Avatar Section -->
<div class="flex flex-col items-center justify-center py-space-sm mb-space-lg">
<div class="relative group cursor-pointer">
<!-- Avatar with shadow -->
<div class="w-20 h-20 rounded-full overflow-hidden shadow-sm relative">
<img alt="Sarah Martinez Profile Photo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AEtjO1Ucz031J3krFe8POGUdxrR7ySIQH5LuNZPwxeWyceKQp-ayvYUwP0CUfLEaFXntGrsnTLV-ICGqLtlpqvf_hvmfw3bNHbOwRnFaDJIwUBLR-hSb-7gH5hI29SAYkD1JlghZSAOM6Q5GaHVpUZbABSJjgWnWAusc2xIQjwm2a0MpX9jpwTth3YT944tjqPzd9pDvxDn_bqkWKASYtIv5PPgUhkwsVRzNNAllzGg1e2Z43PszBYr3XuL5tRde">

<div class="absolute inset-0 bg-inverse-surface/60 backdrop-blur-[1px] flex flex-col items-center justify-center text-surface transition-opacity">

</div>
</div>
<span class="font-caption-md text-caption-md text-tertiary mt-space-sm">Tap photo to select a new portrait</span>
</div>
<!-- Form Fields Container -->
<form class="flex flex-col gap-space-md" id="edit-profile-form" onsubmit="event.preventDefault()">
<!-- First Name -->
<div class="flex flex-col gap-space-xs">
<label class="font-caption-sm text-caption-sm uppercase tracking-wider text-tertiary pl-1 font-label-md" for="first-name">
        FIRST NAME
      </label>
<div class="relative flex items-center">
<input autocomplete="given-name" class="w-full h-12 px-space-md rounded-xl bg-tertiary-fixed text-on-surface font-body-lg text-body-lg outline-none transition-all focus:bg-surface-container-lowest focus:shadow-sm" id="first-name" type="text" value="Sarah">
<div class="absolute right-3 text-tertiary flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[18px]">badge</span>
</div>
</div>
</div>
<!-- Last Name -->
<div class="flex flex-col gap-space-xs">
<label class="font-caption-sm text-caption-sm uppercase tracking-wider text-tertiary pl-1 font-label-md" for="last-name">
        LAST NAME
      </label>
<div class="relative flex items-center">
<input autocomplete="family-name" class="w-full h-12 px-space-md rounded-xl bg-tertiary-fixed text-on-surface font-body-lg text-body-lg outline-none transition-all focus:bg-surface-container-lowest focus:shadow-sm" id="last-name" type="text" value="Martinez">
<div class="absolute right-3 text-tertiary flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[18px]">person</span>
</div>
</div>
</div>
<!-- Bio Field -->
<div class="flex flex-col gap-space-xs">
<div class="flex justify-between items-baseline px-1">
<label class="font-caption-sm text-caption-sm uppercase tracking-wider text-tertiary font-label-md" for="bio">

</div>
<div class="relative">
<textarea class="w-full h-24 p-3 rounded-xl bg-tertiary-fixed text-on-surface font-body-md text-body-md resize-none outline-none transition-all focus:bg-surface-container-lowest focus:shadow-sm" id="bio" maxlength="500" rows="3">Trail runner, café sketcher, and weekend camper. Always looking for the next adventure ⛰️</textarea>
</div>
</div>
<!-- Profile Picture URL (Read-only) -->
<div class="flex flex-col gap-space-xs">
<label class="font-caption-sm text-caption-sm uppercase tracking-wider text-tertiary pl-1 font-label-md" for="avatar-url">
        PROFILE PICTURE URL
      </label>
<div class="relative flex items-center">
<input class="w-full h-12 pl-space-md pr-10 rounded-xl bg-surface-container text-tertiary font-caption-md text-caption-md truncate outline-none select-none cursor-not-allowed" id="avatar-url" readonly="" tabindex="-1" type="text" value="https://storage.nexus.app/uploads/sarah_avatar.webp">
<div class="absolute right-3 text-tertiary flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[18px]">lock</span>
</div>
</div>
</div>
<!-- Additional Tactile Context Chip -->
<div class="flex items-center gap-space-sm p-space-sm rounded-xl bg-surface-container-low mt-space-xs">
<span class="material-symbols-outlined text-tertiary text-[20px] ml-1">info</span>
<p class="font-caption-sm text-caption-sm text-on-surface-variant flex-1">
        Your verified badge and meetup organizer status are linked to this profile handle.
      </p>
</div>
</form>
<!-- Danger Zone / Delete Account Section -->
<div class="flex flex-col items-center justify-center mt-space-xl pt-space-md mb-space-lg">

<span class="material-symbols-outlined text-[18px]">delete_forever</span>
<span class="">Delete Account</span>
</button>
</div>
</div>
<script>
  (function() {
    // Dynamic counter update for delightful micro-interaction
    const bioTextarea = document.getElementById('bio');
    const bioCounter = document.getElementById('bio-counter');
    const saveBtn = document.getElementById('save-btn');

    if (bioTextarea && bioCounter) {
      bioTextarea.addEventListener('input', function() {
        const length = bioTextarea.value.length;
        bioCounter.textContent = length + ' / 500';
      });
    }

    if (saveBtn) {
      saveBtn.addEventListener('click', function() {
        saveBtn.classList.add('scale-95');
        setTimeout(() => saveBtn.classList.remove('scale-95'), 150);
      });
    }
  })();
</script></main><nav class="fixed bottom-0 w-full z-50 pb-safe bg-surface-container-lowest/90 backdrop-blur-xl shadow-[0_-2px_12px_rgba(0,0,0,0.05)]" data-active-classes="text-primary-container font-label-md"><div class="flex justify-around items-center h-16 px-space-xs"><a class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] text-tertiary hover:text-on-surface transition-colors" data-path="home" href="#"><span class="material-symbols-outlined text-[24px]">home</span><span class="font-caption-sm text-caption-sm">Home</span></a><a aria-current="page" class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] transition-colors text-primary-container font-label-md" data-path="explore" href="#"><span class="material-symbols-outlined text-[24px]">explore</span><span class="font-caption-sm text-caption-sm">Explore</span></a><button aria-label="Create" class="w-11 h-11 rounded-full bg-primary-container text-on-primary flex items-center justify-center transition-transform active:scale-95 shadow-sm" type="button"><span class="material-symbols-outlined text-[24px]">add</span></button><a class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] text-tertiary hover:text-on-surface transition-colors" data-path="hangouts" href="#"><span class="material-symbols-outlined text-[24px]">forum</span><span class="font-caption-sm text-caption-sm">Hangouts</span></a><a class="flex flex-col items-center justify-center min-w-[44px] min-h-[44px] text-tertiary hover:text-on-surface transition-colors" data-path="profile" href="#"><span class="material-symbols-outlined text-[24px]">account_circle</span><span class="font-caption-sm text-caption-sm">Profile</span></a></div></nav>
