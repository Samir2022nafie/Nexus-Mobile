  </head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full px-margin bg-surface"><div class="flex flex-col w-full max-w-[393px] mx-auto min-w-0 pb-space-lg">

<h1 class="font-headline-sm text-headline-sm text-on-surface text-center">Log In</h1>
<div aria-hidden="true" class="w-11 h-11"></div>
</header>
<!-- Editorial Welcome Framing -->
<div class="flex items-center gap-space-md p-space-md bg-surface-container-low rounded-xl mb-space-lg shadow-sm">
<div class="w-12 h-12 rounded-lg bg-primary-fixed flex items-center justify-center shrink-0 text-on-primary-fixed">

</div>
<div class="flex flex-col min-w-0">
<span class="font-label-md text-label-md text-on-surface truncate">Welcome back, explorer</span>
<span class="font-caption-md text-caption-md text-on-surface-variant">Rejoin intimate talks, firesides &amp; local circles</span>
</div>
</div>
<!-- Form Section -->
<form class="flex flex-col w-full" id="login-form" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-space-sm">
<!-- Identifier Input -->
<div class="flex flex-col">
<label class="sr-only" for="identifier">Email or phone number</label>
<div class="relative w-full">
<input autocomplete="username" class="w-full h-12 px-space-md bg-tertiary-fixed text-on-surface placeholder:text-outline rounded-xl font-body-md text-body-md outline-none transition-all duration-150 focus:bg-surface-container-lowest focus:shadow-md" id="identifier" placeholder="Email or phone number" type="text">
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col">
<label class="sr-only" for="password">Password</label>
<div class="relative w-full flex items-center">
<input autocomplete="current-password" class="w-full h-12 pl-space-md pr-12 bg-tertiary-fixed text-on-surface placeholder:text-outline rounded-xl font-body-md text-body-md outline-none transition-all duration-150 focus:bg-surface-container-lowest focus:shadow-md" id="password" placeholder="Password" type="password">
<button aria-label="Toggle password visibility" class="absolute right-0 w-12 h-12 flex items-center justify-center text-outline active:text-on-surface transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-eye-icon">visibility_off</span>
</button>
</div>
</div>
<!-- Contextual Helper Text -->
<p class="font-caption-sm text-caption-sm text-outline px-space-xs mt-space-xs leading-relaxed">
        Use the email or verified phone number you registered with
      </p>
</div>
<!-- Disabled Action Button State -->
<div class="mt-space-xl">
<button class="w-full h-12 rounded-full bg-primary-container text-on-surface font-label-lg text-label-lg flex items-center justify-center opacity-40 shadow-sm cursor-not-allowed transition-all duration-200" disabled="" id="login-submit-btn" type="submit">
        Log In
      </button>
</div>
</form>
<!-- Split Divider -->
<div class="relative flex items-center justify-center my-space-lg">
<div class="w-full h-[1px] bg-outline-variant"></div>
<span class="absolute px-space-sm bg-surface font-caption-md text-caption-md text-outline">
      or continue with
    </span>
</div>
<!-- Social Authentication Row -->
<div class="flex items-center justify-center gap-space-md">
<!-- Google Auth Button -->
<button aria-label="Sign in with Google" class="w-12 h-12 rounded-xl bg-tertiary-fixed flex items-center justify-center text-on-surface shadow-sm active:scale-95 transition-transform" type="button">
<svg aria-hidden="true" class="w-5 h-5" viewBox="0 0 24 24">

<path d="M5.28 14.27A7.16 7.16 0 0 1 4.9 12c0-.79.14-1.57.38-2.27V6.58H1.24A11.96 11.96 0 0 0 0 12c0 1.92.45 3.74 1.24 5.42l4.04-3.15z" fill="#FBBC05"></path>
<path d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.36 0 3.26 2.6 1.24 6.58l4.04 3.15c.95-2.83 3.6-4.98 6.72-4.98z" fill="#EA4335"></path>
</svg>
</button>

<button aria-label="Sign in with Apple" class="w-12 h-12 rounded-xl bg-tertiary-fixed flex items-center justify-center text-on-surface shadow-sm active:scale-95 transition-transform" type="button">
<svg aria-hidden="true" class="w-5 h-5 fill-current" viewBox="0 0 170 170">
<path d="M150.37 130.25c-2.45 5.66-5.35 10.87-8.71 15.66-4.58 6.53-8.33 11.05-11.22 13.56-4.48 4.12-9.28 6.23-14.42 6.35-3.69 0-8.14-1.05-13.32-3.18-5.19-2.12-9.97-3.17-14.34-3.17-4.58 0-9.49 1.05-14.75 3.17-5.26 2.13-9.5 3.24-12.74 3.35-4.35.13-9.16-1.9-14.42-6.08-3.69-3.04-7.67-7.81-11.97-14.34-5.65-8.59-10.15-18.49-13.51-29.7C8.12 104.66 6.4 93.64 6.4 82.81c0-14.35 3.49-26.47 10.46-36.36 6.98-9.89 15.7-14.94 26.17-15.15 4.8 0 10.36 1.34 16.68 4.02 6.32 2.68 10.14 4.08 11.47 4.22 1.54-.14 5.64-1.61 12.31-4.42 6.67-2.81 12.44-4.08 17.31-3.8 12.92.68 23.36 5.48 31.32 14.4-11.3 6.84-16.79 16.29-16.48 28.33.32 9.5 4.02 17.47 11.11 23.92 7.09 6.45 15.48 10.12 25.17 11.02-2.14 6.55-4.68 12.79-7.63 18.71zM119.22 31.05c0-7.23 2.6-13.9 7.8-20.02 5.2-6.12 11.63-10.1 19.3-11.95.12 1.04.18 1.93.18 2.69 0 7.23-2.67 14.07-8.01 20.52-5.34 6.45-11.9 10.29-19.68 11.53-.25-.92-.37-1.84-.37-2.77z"></path>
</svg>
</button>
</div>
<!-- Bottom Account Prompt -->
<div class="mt-space-xl text-center">
<p class="font-body-md text-body-md text-on-surface">
      Don't have an account?
      <a class="font-label-md text-label-md text-secondary ml-1 active:opacity-75 transition-opacity" href="#create-account">Create Account</a>
</p>
</div>
</div>
<script>
  (function initLoginForm() {
    const identInput = document.getElementById('identifier');
    const passInput = document.getElementById('password');
    const submitBtn = document.getElementById('login-submit-btn');
    const togglePassBtn = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('password-eye-icon');

    function updateButtonState() {
      const hasContent = Boolean(identInput.value.trim() && passInput.value.trim());
      if (hasContent) {
        submitBtn.removeAttribute('disabled');
        submitBtn.classList.remove('opacity-40', 'cursor-not-allowed');
        submitBtn.classList.add('active:scale-[0.98]');
      } else {
        submitBtn.setAttribute('disabled', 'true');
        submitBtn.classList.add('opacity-40', 'cursor-not-allowed');
        submitBtn.classList.remove('active:scale-[0.98]');
      }
    }

    identInput.addEventListener('input', updateButtonState);
    passInput.addEventListener('input', updateButtonState);

    togglePassBtn.addEventListener('click', () => {
      const isPassword = passInput.getAttribute('type') === 'password';
      passInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.textContent = isPassword ? 'visibility' : 'visibility_off';
    });
  })();
</script></main></body></html>
